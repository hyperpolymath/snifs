[tools]
# Language runtimes
rust = "latest"
zig = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

# Runnable tasks (mise reads [alias] as tool aliases, not commands).
# Prettier runs through Deno (npm: specifier), the estate-approved runtime.
[tasks.build]
run = "cargo build --release"

[tasks.test]
run = "cargo test"

[tasks.lint]
run = "deno run --allow-read --allow-env npm:prettier@3.10.1 --check ."

[tasks.fmt]
run = "deno run --allow-read --allow-write --allow-env npm:prettier@3.10.1 --write ."
