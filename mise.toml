[tools]
# Language runtimes
rust = "latest"
zig = "latest"
bun = "1.4"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"
just = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

# Runnable tasks (mise reads [alias] as tool aliases, not commands).
[tasks.build]
run = "just build-wasm"

[tasks.test]
run = "just test-demo"

[tasks.lint]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --check ."

[tasks.fmt]
run = "bun install --frozen-lockfile && bunx --no-install --bun prettier --write ."
