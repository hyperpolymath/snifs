[tools]
# Language runtimes
rust = "latest"
zig = "latest"
denojs = "latest"

# Package managers
pnpm = "latest"
cargo = "latest"
go-task = "latest"

# Formatting & Linting
shfmt = "latest"
stylua = "latest"

# Build tools
cmake = "latest"
ninja = "latest"

# Shell tools
git = "latest"
gnu-sed = "latest"
gnu-tar = "latest"
gnu-grep = "latest"

# Testing

[env]
# Common environment variables

# Task runner alias
[alias]
task = "go-task"

# Runnable tasks (mise reads [alias] as tool aliases, not commands).
[tasks.build]
run = "cargo build --release"

[tasks.test]
run = "cargo test"
